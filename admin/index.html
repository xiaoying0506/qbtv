<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广播台后台管理端</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6c5ce7; --success: #00b894; --danger: #d63031; --dark: #2d3436; --gray: #636e72; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f1f2f6; color: var(--dark); padding-bottom: 30px; }
        header { background: linear-gradient(135deg, #4834d4, var(--primary)); color: white; padding: 20px 15px; text-align: center; position: relative; }
        .container { max-width: 700px; margin: 15px auto; padding: 0 12px; }
        .login-card { background: white; border-radius: 12px; padding: 25px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 40px; }
        .nav-tabs { display: flex; background: white; border-radius: 10px; padding: 5px; margin-bottom: 15px; overflow-x: auto; }
        .tab-btn { flex: 1; border: none; background: transparent; padding: 10px 6px; font-size: 0.8rem; font-weight: bold; color: #747d8c; border-radius: 8px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: var(--primary); color: white; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.85rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #dfe4ea; border-radius: 8px; font-size: 0.9rem; }
        .btn-submit { width: 100%; background: var(--primary); color: white; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>
        <h1>📻 广播台综合管理后台</h1>
    </header>

    <div class="container">
        <!-- 登录框 -->
        <div id="loginSection" class="login-card">
            <h2 style="text-align:center; color:var(--primary); margin-bottom:15px;">🔐 管理员登录</h2>
            <form id="loginForm">
                <div class="form-group"><label>管理员邮箱</label><input type="email" id="adminEmail" value="admin@163.com" required></div>
                <div class="form-group"><label>密码</label><input type="password" id="adminPassword" required></div>
                <button type="submit" class="btn-submit">登录后台</button>
            </form>
        </div>

        <!-- 主界面 -->
        <div id="dashboardSection" class="hidden">
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('banner')">🖼️ 宣传卡片 (announcements)</button>
                <button class="tab-btn" onclick="switchTab('code')">🎫 兑换码 (redemption_codes)</button>
            </div>

            <!-- 🖼️ 宣传卡片发布 (写入 announcements 表) -->
            <div id="bannerTab">
                <div class="card">
                    <h3>➕ 发布宣传卡片海报</h3>
                    <form id="bannerForm">
                        <div class="form-group"><label>海报标题</label><input type="text" id="bannerTitle" required></div>
                        <div class="form-group"><label>图片链接 (image_url)</label><input type="text" id="bannerImageUrl" required></div>
                        <div class="form-group"><label>跳转链接 (link_url)</label><input type="text" id="bannerLinkUrl"></div>
                        <button type="submit" class="btn-submit">发布卡片</button>
                    </form>
                </div>
            </div>

            <!-- 🎫 兑换码管理 (写入 redemption_codes 表) -->
            <div id="codeTab" class="hidden">
                <div class="card">
                    <h3>➕ 生成兑换码</h3>
                    <form id="codeForm">
                        <div class="form-group"><label>兑换码字符</label><input type="text" id="codeString" placeholder="例如：SPORT2026" required></div>
                        <div class="form-group"><label>增加额度</label><input type="number" id="codeQuota" value="1" min="1" required></div>
                        <button type="submit" class="btn-submit">生成兑换码</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mnlmdlqfqyjhnqzjdjfg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4HrnKeD4I4NNrMypwy1cjA_js3mIwVS';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (!error) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else alert('登录失败: ' + error.message);
        });

        function switchTab(tab) {
            document.getElementById('bannerTab').classList.toggle('hidden', tab !== 'banner');
            document.getElementById('codeTab').classList.toggle('hidden', tab !== 'code');
        }

        // 添加宣传海报
        document.getElementById('bannerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await db.from('announcements').insert([{
                title: document.getElementById('bannerTitle').value,
                image_url: document.getElementById('bannerImageUrl').value,
                link_url: document.getElementById('bannerLinkUrl').value,
                is_active: true
            }]);
            if (!error) { alert('🎉 宣传卡片发布成功！'); e.target.reset(); }
            else alert('发布失败: ' + error.message);
        });

        // 添加兑换码
        document.getElementById('codeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await db.from('redemption_codes').insert([{
                code: document.getElementById('codeString').value.toUpperCase(),
                quota: parseInt(document.getElementById('codeQuota').value),
                is_used: false
            }]);
            if (!error) { alert('🎉 兑换码生成成功！'); e.target.reset(); }
            else alert('生成失败: ' + error.message);
        });
    </script>
</body>
</html>
