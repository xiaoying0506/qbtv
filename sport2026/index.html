<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏃 校园运动会背景音乐征集</title>
    <link rel="shortcut icon" href="logo.png" type="image/x-icon">
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #feca57;
            --dark-color: #2d3436;
            --light-color: #f8f9fa;
            --accent-color: #ff7675;
            --notice-bg: #fff9db;
            --notice-border: #ffe066;
            --notice-text: #f59f00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', sans-serif; }
        body { background-color: #f1f2f6; color: var(--dark-color); padding-bottom: 50px; }

        header {
            background: linear-gradient(135deg, #ff6b6b, #ff9f43);
            color: white; text-align: center; padding: 25px 20px;
            position: relative;
        }
        header h1 { font-size: 1.8rem; margin-bottom: 5px; }

        /* 用户信息与退出按钮 */
        .user-bar {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.2);
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
        }
        .btn-logout {
            background: white; color: var(--primary-color); border: none;
            padding: 4px 10px; border-radius: 12px; cursor: pointer; font-weight: bold;
            transition: 0.2s;
        }
        .btn-logout:hover { background: #f0f0f0; }

        /* 规则弹窗样式 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px;
        }
        .modal-card {
            background: white; border-radius: 16px; padding: 25px; max-width: 480px; width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;
        }
        .modal-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 12px; color: #2d3436; }
        .rule-box {
            background: #f8f9fa; border: 1px solid #dfe4ea; border-radius: 10px;
            padding: 15px; text-align: left; font-size: 0.88rem; line-height: 1.6; color: #57606f;
            max-height: 220px; overflow-y: auto; margin-bottom: 20px;
        }

        /* 登录卡片布局 */
        .auth-container { max-width: 400px; margin: 60px auto; padding: 0 15px; }
        .auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #dfe4ea; }
        .auth-tab {
            flex: 1; text-align: center; padding: 10px; cursor: pointer;
            font-weight: bold; color: #747d8c;
        }
        .auth-tab.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); }

        /* 公告栏样式 */
        .notice-card {
            background-color: var(--notice-bg); border: 1px solid var(--notice-border);
            border-left: 5px solid var(--notice-text); padding: 12px 18px; border-radius: 8px;
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #495057;
        }
        .notice-card .notice-icon { font-size: 1.2rem; }
        .notice-card .notice-content { flex: 1; line-height: 1.4; }

        /* 主界面网格布局 */
        .container {
            max-width: 1000px; margin: 20px auto 0 auto; padding: 0 15px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        @media (max-width: 768px) { 
            .container { grid-template-columns: 1fr; } 
            header { padding-bottom: 65px; }
            .user-bar { top: auto; bottom: 12px; transform: none; right: 50%; transform: translateX(50%); }
        }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--primary-color); border-bottom: 2px solid #f1f2f6; padding-bottom: 8px; }

        .limit-hint { font-size: 0.8rem; color: #ff6b6b; font-weight: bold; margin-left: 8px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.85rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #dfe4ea; border-radius: 6px; font-size: 0.9rem;
        }

        .btn-submit {
            width: 100%; background-color: var(--primary-color); color: white;
            border: none; padding: 11px; font-size: 0.95rem; font-weight: bold;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .btn-submit:hover { background-color: #ee5253; }

        .song-list { list-style: none; max-height: 400px; overflow-y: auto; }
        .song-item {
            background-color: var(--light-color); border-radius: 8px; padding: 12px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }
        .song-info { flex: 1; padding-right: 10px; }
        .song-title { font-weight: bold; font-size: 1rem; }
        .song-artist { font-size: 0.85rem; color: #747d8c; margin-top: 2px; }
        .song-reason { font-size: 0.8rem; color: #ff9f43; margin-top: 4px; font-style: italic; }

        audio { margin-top: 8px; width: 100%; max-height: 32px; }

        .vote-btn {
            background: white; border: 1px solid var(--accent-color); color: var(--accent-color);
            padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem;
            display: flex; align-items: center; gap: 4px; white-space: nowrap;
        }
        .vote-btn.voted { background-color: var(--accent-color); color: white; }

        /* 状态标签样式 */
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-top: 5px; }
        .status-pending { background-color: #ffeaa7; color: #d63031; }
        .status-approved { background-color: #55efc4; color: #008148; }
        .status-played { background-color: #a29bfe; color: #2d3436; }
        .status-rejected { background-color: #ff7675; color: #ffffff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 0. 运动会征集规则弹窗 -->
    <div id="ruleModal" class="modal-overlay">
        <div class="modal-card">
            <div style="font-size: 3rem; margin-bottom: 10px;">🏃‍♂️🔥</div>
            <div class="modal-title">校园运动会背景音乐征集须知</div>
            <div class="rule-box">
                <p><strong>亲爱的同学们：</strong></p>
                <p>1. <strong>唯一额度：</strong>每位同学在整个运动会期间<strong>只有 1 次点歌机会</strong>，提交后不可撤回，请谨慎选择！</p>
                <p>2. <strong>曲目要求：</strong>请选择节奏明快、充满激情、内容健康向上的正能量歌曲，为赛场健儿加油打气！</p>
                <p>3. <strong>审核机制：</strong>提交后将由广播站统一审核，通过后会在运动会现场播放并呈现在公开榜单。</p>
            </div>
            <button class="btn-submit" onclick="closeRuleModal()">我已阅读并同意规则</button>
        </div>
    </div>

    <header>
        <h1>🏃 校园运动会背景音乐征集</h1>
        <div id="userBar" class="user-bar hidden">
            <span id="userEmail"></span>
            <button class="btn-logout" onclick="handleLogout()">退出登录</button>
        </div>
    </header>

    <!-- 1. 登录与注册模块 -->
    <div id="authSection" class="auth-container">
        <div class="card">
            <div class="auth-tabs">
                <div id="loginTab" class="auth-tab active" onclick="switchAuthMode('login')">登录</div>
                <div id="registerTab" class="auth-tab" onclick="switchAuthMode('register')">注册账号</div>
            </div>

            <form id="authForm">
                <div class="form-group">
                    <label for="authEmail">邮箱地址 *</label>
                    <input type="email" id="authEmail" placeholder="yourname@school.com" required>
                </div>
                <div class="form-group">
                    <label for="authPassword">密码 *</label>
                    <input type="password" id="authPassword" placeholder="请输入密码 (至少6位)" required minlength="6">
                </div>
                <button type="submit" class="btn-submit" id="authBtn">登录</button>
            </form>
        </div>
    </div>

    <!-- 2. 主应用模块 (默认隐藏) -->
    <div id="appSection" class="container hidden">
        <!-- 左侧：公告栏 + 点歌表单 + 个人点歌历史 -->
        <div>
            <!-- 📢 广播台公告栏 -->
            <div id="noticeContainer" class="notice-card hidden">
                <span class="notice-icon">📢</span>
                <div class="notice-content" id="noticeText">加载公告中...</div>
            </div>

            <!-- 点歌表单 -->
            <div class="card">
                <h2>🎵 运动会点歌 <span id="limitHint" class="limit-hint">每人仅限 1 次</span></h2>
                <form id="songForm">
                    <div class="form-group">
                        <label for="classAndName">班级 / 姓名 *</label>
                        <input type="text" id="classAndName" placeholder="例如：高二(3)班 张三" required>
                    </div>
                    <div class="form-group">
                        <label for="songName">歌曲名称 *</label>
                        <input type="text" id="songName" placeholder="例如：相信自己" required>
                    </div>
                    <div class="form-group">
                        <label for="artist">演唱歌手 *</label>
                        <input type="text" id="artist" placeholder="例如：零点乐队" required>
                    </div>
                    <div class="form-group">
                        <label for="reason">加油寄语 / 点歌理由 (选填)</label>
                        <textarea id="reason" rows="2" placeholder="写下为运动健儿加油打气的话吧..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="musicFile">音频文件 (选填, mp3/wav)</label>
                        <input type="file" id="musicFile" accept="audio/*">
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">提交运动会点歌</button>
                </form>
            </div>

            <!-- 我的点歌历史与审核进度追踪 -->
            <div class="card">
                <h2>🔍 我的征集记录</h2>
                <ul class="song-list" id="myHistoryList">
                    <li style="text-align:center; color:#999; padding:15px;">暂无点歌记录</li>
                </ul>
            </div>
        </div>

        <!-- 右侧：全校公共已通过点播榜 -->
        <div>
            <div class="card">
                <h2>📜 运动会现场播放歌单 (审核通过)</h2>
                <ul class="song-list" id="publicSongList">
                    <li style="text-align:center; color:#999; padding:20px;">加载中...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 1. 初始化 Supabase 参数
        const SUPABASE_URL = 'https://mnlmdlqfqyjhnqzjdjfg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4HrnKeD4I4NNrMypwy1cjA_js3mIwVS';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let isLoginMode = true;

        // 关闭规则弹窗
        function closeRuleModal() {
            document.getElementById('ruleModal').classList.add('hidden');
        }

        // 切换登录 / 注册模式 UI
        function switchAuthMode(mode) {
            isLoginMode = mode === 'login';
            document.getElementById('loginTab').classList.toggle('active', isLoginMode);
            document.getElementById('registerTab').classList.toggle('active', !isLoginMode);
            document.getElementById('authBtn').innerText = isLoginMode ? '登录' : '注册';
        }

        // 监听身份认证状态变化
        db.auth.onAuthStateChange((event, session) => {
            if (session && session.user) {
                currentUser = session.user;
                showAppUI();
            } else {
                currentUser = null;
                showAuthUI();
            }
        });

        function showAppUI() {
            document.getElementById('authSection').classList.add('hidden');
            document.getElementById('appSection').classList.remove('hidden');
            document.getElementById('userBar').classList.remove('hidden');
            document.getElementById('userEmail').innerText = currentUser.email;

            fetchNotice();
            fetchPublicSongs();
            fetchMyHistory();
        }

        function showAuthUI() {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('appSection').classList.add('hidden');
            document.getElementById('userBar').classList.add('hidden');
        }

        // 2. 登录 / 注册逻辑
        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const authBtn = document.getElementById('authBtn');

            authBtn.disabled = true;
            authBtn.innerText = '处理中...';

            try {
                if (isLoginMode) {
                    const { error } = await db.auth.signInWithPassword({ email, password });
                    if (error) alert('登录失败: ' + error.message);
                } else {
                    const { error } = await db.auth.signUp({ email, password });
                    if (error) {
                        alert('注册失败: ' + error.message);
                    } else {
                        alert('🎉 注册成功！请直接登录。');
                        switchAuthMode('login');
                    }
                }
            } catch (err) {
                alert('网络异常: ' + err.message);
            } finally {
                authBtn.disabled = false;
                authBtn.innerText = isLoginMode ? '登录' : '注册';
            }
        });

        // 退出登录
        async function handleLogout() {
            await db.auth.signOut();
        }

        // 3. 加载广播台最新公告
        async function fetchNotice() {
            const { data, error } = await db
                .from('announcements')
                .select('content')
                .eq('is_active', true)
                .order('created_at', { ascending: false })
                .limit(1);

            if (!error && data && data.length > 0 && data[0].content && data[0].content.trim() !== '') {
                document.getElementById('noticeText').innerText = data[0].content;
                document.getElementById('noticeContainer').classList.remove('hidden');
            } else {
                document.getElementById('noticeContainer').classList.add('hidden');
            }
        }

        // 查询用户历史提交总数（每人限 1 次）
        async function getUserSongCount() {
            const { count, error } = await db
                .from('songs')
                .select('id', { count: 'exact', head: true })
                .eq('voter_id', currentUser.id);

            return error ? 0 : count;
        }

        // 4. 加载公共榜单 (status 为 approved 或 played)
        async function fetchPublicSongs() {
            const publicListEl = document.getElementById('publicSongList');

            const { data: songs, error } = await db
                .from('songs')
                .select('*')
                .in('status', ['approved', 'played'])
                .order('votes', { ascending: false });

            if (error || !songs) {
                publicListEl.innerHTML = '<li style="text-align:center; color:red;">加载失败</li>';
                return;
            }

            if (songs.length === 0) {
                publicListEl.innerHTML = '<li style="text-align:center; color:#999; padding:20px;">暂无运动会播放歌单</li>';
                return;
            }

            const songIds = songs.map(s => s.id);
            const { data: userVotes } = await db
                .from('song_votes')
                .select('song_id')
                .eq('voter_id', currentUser.id)
                .in('song_id', songIds);

            const votedSongIds = new Set((userVotes || []).map(v => v.song_id));

            publicListEl.innerHTML = '';
            songs.forEach((song) => {
                const isVoted = votedSongIds.has(song.id);
                const li = document.createElement('li');
                li.className = 'song-item';
                
                let audioPlayer = song.audio_url ? `<audio controls src="${song.audio_url}"></audio>` : '';
                let statusBadge = song.status === 'played' 
                    ? `<span class="status-badge status-played">📻 现场已播放</span>` 
                    : `<span class="status-badge status-approved">🟢 审核通过 / 待播放</span>`;
                let reasonHtml = song.reason ? `<div class="song-reason">💬 "${escapeHtml(song.reason)}"</div>` : '';

                li.innerHTML = `
                    <div class="song-info">
                        <div class="song-title">🎶 ${escapeHtml(song.song_name)}</div>
                        <div class="song-artist">歌手: ${escapeHtml(song.artist)} | 点歌人: ${escapeHtml(song.class_and_name || '匿名')}</div>
                        ${reasonHtml}
                        ${statusBadge}
                        ${audioPlayer}
                    </div>
                    <button class="vote-btn ${isVoted ? 'voted' : ''}" onclick="toggleVote(${song.id}, ${song.votes}, ${isVoted})">
                        ❤️ <span>${song.votes || 0}</span>
                    </button>
                `;
                publicListEl.appendChild(li);
            });
        }

        // 5. 加载“我的点歌记录”并校验每个人唯一额度
        async function fetchMyHistory() {
            const historyListEl = document.getElementById('myHistoryList');
            const submitBtn = document.getElementById('submitBtn');
            const userCount = await getUserSongCount();

            if (userCount >= 1) {
                document.getElementById('limitHint').innerText = '已用完点歌额度 (1/1)';
                submitBtn.disabled = true;
                submitBtn.innerText = '您已完成运动会点歌 (每人限1次)';
                submitBtn.style.backgroundColor = '#b2bec3';
            }

            const { data: mySongs, error } = await db
                .from('songs')
                .select('*')
                .eq('voter_id', currentUser.id)
                .order('created_at', { ascending: false });

            if (error || !mySongs) {
                historyListEl.innerHTML = '<li style="text-align:center; color:red;">加载历史失败</li>';
                return;
            }

            if (mySongs.length === 0) {
                historyListEl.innerHTML = '<li style="text-align:center; color:#999; padding:15px;">你还没有点歌哦</li>';
                return;
            }

            historyListEl.innerHTML = '';
            mySongs.forEach((song) => {
                const li = document.createElement('li');
                li.className = 'song-item';

                let statusBadge = '';
                let reasonNotice = '';

                if (song.status === 'pending') {
                    statusBadge = `<span class="status-badge status-pending">🟡 审核中</span>`;
                } else if (song.status === 'approved') {
                    statusBadge = `<span class="status-badge status-approved">🟢 已入选运动会歌单</span>`;
                } else if (song.status === 'played') {
                    statusBadge = `<span class="status-badge status-played">🟣 现场已播放</span>`;
                } else if (song.status === 'rejected') {
                    statusBadge = `<span class="status-badge status-rejected">🔴 未入选</span>`;
                    if (song.reject_reason) {
                        reasonNotice = `<div style="font-size:0.8rem; color:#d63031; margin-top:6px; background:#ffeaa7; padding:4px 8px; border-radius:4px;">⚠️ 说明：${escapeHtml(song.reject_reason)}</div>`;
                    }
                }

                li.innerHTML = `
                    <div class="song-info">
                        <div class="song-title">🎶 ${escapeHtml(song.song_name)}</div>
                        <div class="song-artist">歌手: ${escapeHtml(song.artist)}</div>
                        <div>${statusBadge}</div>
                        ${reasonNotice}
                    </div>
                `;
                historyListEl.appendChild(li);
            });
        }

        // 6. 提交点歌处理（严格限制每个人仅 1 次）
        document.getElementById('songForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');

            const count = await getUserSongCount();
            if (count >= 1) {
                alert('⚠️ 每位同学在运动会期间仅有 1 次点歌机会，请勿重复提交！');
                return;
            }

            btn.disabled = true;
            btn.innerText = '正在提交...';

            let audioUrl = '';
            const fileInput = document.getElementById('musicFile');
            const file = fileInput.files[0];

            if (file) {
                const fileName = `${Date.now()}_${file.name}`;
                const { error: uploadError } = await db.storage
                    .from('music-files')
                    .upload(fileName, file);

                if (uploadError) {
                    alert('音频上传失败: ' + uploadError.message);
                    btn.disabled = false;
                    btn.innerText = '提交运动会点歌';
                    return;
                }

                const { data: publicUrlData } = db.storage
                    .from('music-files')
                    .getPublicUrl(fileName);

                audioUrl = publicUrlData.publicUrl;
            }

            const { error } = await db.from('songs').insert([{
                class_and_name: document.getElementById('classAndName').value,
                song_name: document.getElementById('songName').value,
                artist: document.getElementById('artist').value,
                reason: document.getElementById('reason').value,
                audio_url: audioUrl,
                status: 'pending',
                voter_id: currentUser.id, 
                votes: 0
            }]);

            if (error) {
                alert('提交失败: ' + error.message);
                btn.disabled = false;
                btn.innerText = '提交运动会点歌';
            } else {
                alert('🎉 提交成功！请等待广播站审核。');
                this.reset();
                fetchMyHistory();
            }
        });

        // 7. 点赞逻辑
        async function toggleVote(songId, currentVotes, isVoted) {
            if (isVoted) {
                await db.from('song_votes').delete().eq('song_id', songId).eq('voter_id', currentUser.id);
                await db.from('songs').update({ votes: Math.max(0, currentVotes - 1) }).eq('id', songId);
            } else {
                await db.from('song_votes').insert([{ song_id: songId, voter_id: currentUser.id }]);
                await db.from('songs').update({ votes: currentVotes + 1 }).eq('id', songId);
            }
            fetchPublicSongs();
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
