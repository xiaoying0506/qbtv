<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ 运动会点歌后台管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --dark-color: #2d3436;
            --light-bg: #f8f9fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', sans-serif; }
        body { background-color: #f1f2f6; color: var(--dark-color); padding-bottom: 50px; }

        /* 顶部导航栏及转换提示栏 */
        .top-nav {
            background: #1e272e; color: white; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .top-nav-left { display: flex; align-items: center; gap: 15px; }
        .top-nav-left h1 { font-size: 1.3rem; margin: 0; }
        .home-btn {
            background-color: #00d2d3; color: #1e272e; font-weight: bold;
            padding: 8px 16px; border-radius: 6px; text-decoration: none; transition: background 0.2s;
        }
        .home-btn:hover { background-color: #54a0ff; color: white; }

        .format-tip-banner {
            background: #fff200; color: #2c2c54; padding: 10px 20px; font-size: 0.9rem;
            font-weight: bold; text-align: center; border-bottom: 2px solid #ffd32a;
        }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }

        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card h2 { font-size: 1.2rem; margin-bottom: 15px; border-bottom: 2px solid #f1f2f6; padding-bottom: 8px; }

        /* 公告控制面板 */
        .notice-form { display: flex; gap: 10px; }
        .notice-form input { flex: 1; padding: 10px; border: 1px solid #dfe4ea; border-radius: 6px; }

        /* 筛选标签页 */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #dfe4ea; padding-bottom: 10px; }
        .tab-btn {
            background: none; border: none; font-size: 1rem; font-weight: bold;
            color: #636e72; padding: 6px 16px; cursor: pointer; border-radius: 6px;
        }
        .tab-btn.active { background: var(--primary-color); color: white; }

        /* 数据表格 */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #dfe4ea; }
        th { background: #f8f9fa; color: #2d3436; }

        /* 状态样式 */
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .badge-pending { background-color: #ffeaa7; color: #d63031; }
        .badge-approved { background-color: #55efc4; color: #008148; }
        .badge-played { background-color: #a29bfe; color: #2d3436; }
        .badge-rejected { background-color: #ff7675; color: #ffffff; }

        /* 操作按钮 */
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-right: 4px; }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-reject { background: #e74c3c; color: white; }
        .btn-played { background: #9b59b6; color: white; }
        .btn-delete { background: #b2bec3; color: white; }
        .btn-submit { background: var(--primary-color); color: white; }
        .btn:hover { opacity: 0.85; }

        audio { max-height: 30px; width: 200px; }
    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="top-nav">
        <div class="top-nav-left">
            <a href="index.html" class="home-btn">🏠 前往首页</a>
            <h1>⚙️ 运动会广播台后台管理系统</h1>
        </div>
    </header>

    <!-- 音频格式转码提示 Banner -->
    <div class="format-tip-banner">
        ⚠️ 本系统仅支持上传 MP3 格式音频！如音频格式不是 MP3，请点击顶部【前往首页】按钮，使用首页提供的转换工具进行格式转换后再投稿。
    </div>

    <div class="container">
        <!-- 1. 广播站公告管理面板 -->
        <div class="card">
            <h2>📢 发布 / 修改广播台公告</h2>
            <div class="notice-form">
                <input type="text" id="noticeInput" placeholder="输入公告内容（例如：请大家积极投稿 MP3 格式歌曲！）">
                <button class="btn btn-submit" onclick="updateNotice()">更新公告</button>
            </div>
        </div>

        <!-- 2. 征集歌曲审核与播放控制列表 -->
        <div class="card">
            <h2>🎵 征集歌曲管理与审核</h2>

            <!-- 分类筛选按钮 -->
            <div class="tabs">
                <button class="tab-btn active" onclick="filterStatus('all', this)">全部歌曲</button>
                <button class="tab-btn" onclick="filterStatus('pending', this)">⏳ 待审核</button>
                <button class="tab-btn" onclick="filterStatus('approved', this)">🟢 已通过</button>
                <button class="tab-btn" onclick="filterStatus('played', this)">📻 已播放</button>
                <button class="tab-btn" onclick="filterStatus('rejected', this)">🔴 已拒绝</button>
            </div>

            <table id="songTable">
                <thead>
                    <tr>
                        <th>班级 / 姓名</th>
                        <th>歌名 / 歌手</th>
                        <th>试听 (MP3)</th>
                        <th>获赞</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="songTableBody">
                    <tr><td colspan="6" style="text-align:center; color:#999;">数据加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mnlmdlqfqyjhnqzjdjfg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4HrnKeD4I4NNrMypwy1cjA_js3mIwVS';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentFilter = 'all';
        let allSongs = [];

        window.onload = function() {
            fetchNotice();
            fetchSongs();
        };

        async function fetchNotice() {
            const { data } = await db
                .from('sport2026_announcements')
                .select('content')
                .eq('is_active', true)
                .order('created_at', { ascending: false })
                .limit(1);

            if (data && data.length > 0) {
                document.getElementById('noticeInput').value = data[0].content;
            }
        }

        async function updateNotice() {
            const content = document.getElementById('noticeInput').value.trim();
            if (!content) {
                alert('公告内容不能为空！');
                return;
            }

            await db.from('sport2026_announcements').update({ is_active: false }).neq('id', 0);
            const { error } = await db.from('sport2026_announcements').insert([{ content, is_active: true }]);

            if (error) {
                alert('更新失败：' + error.message);
            } else {
                alert('🎉 公告更新成功！');
            }
        }

        async function fetchSongs() {
            const { data, error } = await db
                .from('sport2026_songs')
                .select('*')
                .order('votes', { ascending: false });

            if (error) {
                alert('获取歌曲列表失败');
                return;
            }

            allSongs = data || [];
            renderTable();
        }

        function filterStatus(status, btnEl) {
            currentFilter = status;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('songTableBody');
            tbody.innerHTML = '';

            const filteredSongs = allSongs.filter(s => currentFilter === 'all' || s.status === currentFilter);

            if (filteredSongs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#999;">暂无相关歌曲数据</td></tr>';
                return;
            }

            filteredSongs.forEach(song => {
                const tr = document.createElement('tr');

                let statusTag = '';
                if (song.status === 'pending') statusTag = `<span class="badge badge-pending">待审核</span>`;
                else if (song.status === 'approved') statusTag = `<span class="badge badge-approved">已通过</span>`;
                else if (song.status === 'played') statusTag = `<span class="badge badge-played">已播放</span>`;
                else if (song.status === 'rejected') statusTag = `<span class="badge badge-rejected">已拒绝</span>`;

                let audioTag = song.audio_url ? `<audio controls src="${song.audio_url}"></audio>` : '无音频';

                let actionBtns = '';
                if (song.status === 'pending') {
                    actionBtns += `<button class="btn btn-approve" onclick="updateStatus(${song.id}, 'approved')">通过</button>`;
                    actionBtns += `<button class="btn btn-reject" onclick="rejectSong(${song.id})">拒绝</button>`;
                } else if (song.status === 'approved') {
                    actionBtns += `<button class="btn btn-played" onclick="updateStatus(${song.id}, 'played')">标记已播放</button>`;
                    actionBtns += `<button class="btn btn-reject" onclick="rejectSong(${song.id})">改判拒绝</button>`;
                } else if (song.status === 'played') {
                    actionBtns += `<span style="color:#636e72; font-size:0.8rem;">已播完</span>`;
                } else {
                    actionBtns += `<button class="btn btn-approve" onclick="updateStatus(${song.id}, 'approved')">重新通过</button>`;
                }

                actionBtns += `<button class="btn btn-delete" onclick="deleteSong(${song.id})">删除</button>`;

                tr.innerHTML = `
                    <td><strong>${escapeHtml(song.class_and_name)}</strong></td>
                    <td><b>${escapeHtml(song.song_name)}</b><br><small style="color:#636e72;">${escapeHtml(song.artist)}</small></td>
                    <td>${audioTag}</td>
                    <td>❤️ ${song.votes || 0}</td>
                    <td>${statusTag}</td>
                    <td>${actionBtns}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function updateStatus(id, newStatus, reason = '') {
            const updatePayload = { status: newStatus };
            if (reason) updatePayload.reject_reason = reason;

            const { error } = await db.from('sport2026_songs').update(updatePayload).eq('id', id);

            if (error) {
                alert('操作失败：' + error.message);
            } else {
                fetchSongs();
            }
        }

        function rejectSong(id) {
            const reason = prompt('请输入拒绝原因（例如：音频非 MP3 格式或歌词包含不宜内容）：');
            if (reason !== null) {
                updateStatus(id, 'rejected', reason);
            }
        }

        async function deleteSong(id) {
            if (confirm('确认要永久删除这条点歌记录吗？')) {
                const { error } = await db.from('sport2026_songs').delete().eq('id', id);
                if (error) alert('删除失败');
                else fetchSongs();
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
