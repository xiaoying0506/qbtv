<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ 运动会背景音乐征集 - 后台管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- 1. 头部区域 -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-xl font-bold text-slate-800">⚙️ 运动会背景音乐征集后台</h1>
                <p class="text-xs text-slate-500 mt-1">实时审核歌单、发布广播台公告及导出 Excel / CSV 表单</p>
            </div>
            <div>
                <button id="exportBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition shadow-sm">
                    📊 导出 CSV 表单
                </button>
            </div>
        </div>

        <!-- 2. 发布广播台公告面板 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
            <h2 class="text-sm font-bold text-slate-800">📢 发布 / 更新运动会前台公告</h2>
            <div class="flex gap-3">
                <input type="text" id="noticeInput" placeholder="请输入前台广播台公告（留空并点击保存可清除公告）..." class="flex-1 border border-slate-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-red-500 focus:outline-none">
                <button id="saveNoticeBtn" class="px-5 py-2.5 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-lg transition">
                    保存公告
                </button>
            </div>
        </div>

        <!-- 3. 点歌提报审核列表 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-800">🎵 征集提报审核列表</h2>
                <span id="totalCount" class="text-xs text-slate-500">加载中...</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-50 text-slate-600 font-semibold uppercase border-b border-slate-100">
                        <tr>
                            <th class="p-3">提交时间</th>
                            <th class="p-3">班级/姓名</th>
                            <th class="p-3">歌名</th>
                            <th class="p-3">歌手</th>
                            <th class="p-3">获赞</th>
                            <th class="p-3">状态</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="songTableBody" class="divide-y divide-slate-100 text-slate-700">
                        <!-- 动态渲染数据 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://mnlmdlqfqyjhnqzjdjfg.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_4HrnKeD4I4NNrMypwy1cjA_js3mIwVS';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const songTableBody = document.getElementById('songTableBody');
        const noticeInput = document.getElementById('noticeInput');
        const saveNoticeBtn = document.getElementById('saveNoticeBtn');
        const exportBtn = document.getElementById('exportBtn');
        const totalCount = document.getElementById('totalCount');

        let globalSongList = [];

        // 加载后台数据
        async function fetchAdminSongs() {
            const { data, error } = await db
                .from('songs')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return alert('读取数据失败：' + error.message);

            globalSongList = data || [];
            totalCount.innerText = `共 ${globalSongList.length} 条提报记录`;
            songTableBody.innerHTML = '';

            if (globalSongList.length === 0) {
                songTableBody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">暂无点歌数据</td></tr>`;
                return;
            }

            globalSongList.forEach(item => {
                const tr = document.createElement('tr');
                
                let statusTag = `<span class="px-2 py-0.5 rounded bg-amber-100 text-amber-700 font-bold">待审核</span>`;
                if (item.status === 'approved') statusTag = `<span class="px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 font-bold">已通过</span>`;
                if (item.status === 'played') statusTag = `<span class="px-2 py-0.5 rounded bg-purple-100 text-purple-700 font-bold">已播放</span>`;
                if (item.status === 'rejected') statusTag = `<span class="px-2 py-0.5 rounded bg-red-100 text-red-700 font-bold">已拒绝</span>`;

                const timeStr = new Date(item.created_at).toLocaleString();

                tr.innerHTML = `
                    <td class="p-3 text-slate-400">${timeStr}</td>
                    <td class="p-3 font-semibold">${escapeHtml(item.class_and_name || '未填写')}</td>
                    <td class="p-3 text-red-600 font-bold">${escapeHtml(item.song_name)}</td>
                    <td class="p-3">${escapeHtml(item.artist)}</td>
                    <td class="p-3 font-bold text-amber-600">❤️ ${item.votes || 0}</td>
                    <td class="p-3">${statusTag}</td>
                    <td class="p-3 text-center space-x-1">
                        <button onclick="updateStatus(${item.id}, 'approved')" class="px-2 py-1 bg-emerald-500 hover:bg-emerald-600 text-white rounded font-bold">通过</button>
                        <button onclick="updateStatus(${item.id}, 'played')" class="px-2 py-1 bg-purple-500 hover:bg-purple-600 text-white rounded font-bold">已播</button>
                        <button onclick="rejectItem(${item.id})" class="px-2 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded font-bold">拒绝</button>
                        <button onclick="deleteItem(${item.id})" class="px-2 py-1 bg-red-500 hover:bg-red-600 text-white rounded font-bold">删除</button>
                    </td>
                `;
                songTableBody.appendChild(tr);
            });
        }

        // 修改状态（通过/已播）
        window.updateStatus = async function(id, status) {
            await db.from('songs').update({ status }).eq('id', id);
            fetchAdminSongs();
        };

        // 拒绝点歌
        window.rejectItem = async function(id) {
            const reason = prompt('请输入拒绝说明/原因（同学可在个人记录中查看）：');
            if (reason === null) return;
            await db.from('songs').update({ status: 'rejected', reject_reason: reason }).eq('id', id);
            fetchAdminSongs();
        };

        // 删除记录
        window.deleteItem = async function(id) {
            if (!confirm('确定要删除此条记录吗？删除后该同学可重新点歌。')) return;
            await db.from('songs').delete().eq('id', id);
            fetchAdminSongs();
        };

        // 发布/更新公告
        saveNoticeBtn.addEventListener('click', async () => {
            const val = noticeInput.value.trim();
            if (val === '') {
                await db.from('announcements').update({ is_active: false }).eq('is_active', true);
                alert('已清除所有显示中的公告！');
            } else {
                await db.from('announcements').update({ is_active: false }).eq('is_active', true);
                await db.from('announcements').insert([{ content: val, is_active: true }]);
                alert('运动会公告发布成功！');
            }
        });

        // 导出 CSV
        exportBtn.addEventListener('click', () => {
            if (globalSongList.length === 0) return alert('暂无可导出的数据');

            let csvContent = "\uFEFF提交时间,班级姓名,歌曲名称,歌手,获赞数,审核状态\n";
            globalSongList.forEach(item => {
                const timeStr = new Date(item.created_at).toLocaleString();
                csvContent += `"${timeStr}","${item.class_and_name || ''}","${item.song_name}","${item.artist}","${item.votes || 0}","${item.status}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `运动会音乐征集表_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        });

        // 加载当前最新公告
        async function fetchCurrentNotice() {
            const { data } = await db.from('announcements').select('content').eq('is_active', true).limit(1);
            if (data && data.length > 0) noticeInput.value = data[0].content;
        }

        // 转义防 XSS 攻击
        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            fetchAdminSongs();
            fetchCurrentNotice();
        });
    </script>
</body>
</html>
