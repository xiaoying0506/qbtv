<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔓 NCM 格式在线解密工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🔓 NCM 格式转 MP3 / FLAC</h1>
            <p class="text-sm text-slate-500 mt-1">本地原生硬解 · 修复播放器报错</p>
        </div>

        <div id="dropzone" class="border-2 border-dashed border-indigo-200 rounded-xl p-8 text-center hover:border-indigo-500 transition cursor-pointer bg-indigo-50/30">
            <input type="file" id="fileInput" accept=".ncm" multiple class="hidden">
            <div class="space-y-2">
                <div class="text-4xl">🎼</div>
                <p class="text-sm font-medium text-slate-700">点击选择 NCM 文件 或 拖拽文件到这里</p>
                <p class="text-xs text-slate-400">支持批量解密</p>
            </div>
        </div>

        <div id="fileList" class="mt-6 space-y-3 max-h-60 overflow-y-auto hidden"></div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-indigo-500'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('border-indigo-500'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-indigo-500');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            fileList.classList.remove('hidden');
            for (let file of files) {
                if (!file.name.toLowerCase().endsWith('.ncm')) continue;

                const itemEl = document.createElement('div');
                itemEl.className = 'p-3 bg-slate-50 rounded-lg flex items-center justify-between border border-slate-200 text-xs';
                itemEl.innerHTML = `
                    <span class="font-medium text-slate-700 truncate max-w-[200px]">${file.name}</span>
                    <span class="status text-amber-600 font-bold">解密中...</span>
                `;
                fileList.appendChild(itemEl);

                try {
                    const result = await decryptNcmFile(file);
                    const statusEl = itemEl.querySelector('.status');
                    const url = URL.createObjectURL(result.blob);
                    statusEl.outerHTML = `
                        <a href="${url}" download="${result.filename}" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold transition">
                            📥 下载 ${result.ext.toUpperCase()}
                        </a>
                    `;
                } catch (err) {
                    const statusEl = itemEl.querySelector('.status');
                    statusEl.className = 'text-red-500 font-bold';
                    statusEl.innerText = '解密失败: ' + err.message;
                    console.error(err);
                }
            }
        }

        // Web Crypto API 实现 AES-128-ECB
        async function aesEcbDecrypt(keyBytes, cipherBytes) {
            const cryptoKey = await crypto.subtle.importKey(
                "raw", keyBytes, { name: "AES-CBC" }, false, ["decrypt"]
            );
            // ECB 模式通过零向量 IV + 手动分块模拟
            const iv = new Uint8Array(16);
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-CBC", iv: iv }, cryptoKey, cipherBytes
            );
            return new Uint8Array(decrypted);
        }

        async function decryptNcmFile(file) {
            const buffer = await file.arrayBuffer();
            const view = new DataView(buffer);
            let offset = 0;

            // 1. 魔数校验 CTEN
            const magic = view.getUint32(0, true);
            if (magic !== 0x4e455443) throw new Error("非法的 NCM 文件");
            offset += 10;

            // 2. 提取 Key 块
            const keyLen = view.getUint32(offset, true);
            offset += 4;
            const rawKeyBytes = new Uint8Array(buffer, offset, keyLen);
            offset += keyLen;

            // 异或 0x64 还原 AES 密文
            const cipherKeyBytes = new Uint8Array(keyLen);
            for (let i = 0; i < keyLen; i++) cipherKeyBytes[i] = rawKeyBytes[i] ^ 0x64;

            // AES 核心密钥: 68 78 64 52 6d 30 6f 17 63 78 34 31 6c 70 65 5b
            const CORE_KEY = new Uint8Array([0x68,0x78,0x64,0x52,0x6d,0x30,0x6f,0x17,0x63,0x78,0x34,0x31,0x6c,0x70,0x65,0x5b]);

            // WebCrypto 解密
            let decryptedKey;
            try {
                // PKCS7 padding 裁剪
                const decryptedBuffer = await aesEcbDecrypt(CORE_KEY, cipherKeyBytes);
                decryptedKey = decryptedBuffer;
            } catch(e) {
                throw new Error("AES 密钥解密失败");
            }

            // 剪切前缀 'neteasecloudmusic' (17字节)
            const rc4KeyRaw = decryptedKey.slice(17);
            
            // 3. 构造标准网易云 S 盒
            const S = new Uint8Array(256);
            for (let i = 0; i < 256; i++) S[i] = i;
            let j = 0;
            for (let i = 0; i < 256; i++) {
                j = (j + S[i] + rc4KeyRaw[i % rc4KeyRaw.length]) & 0xff;
                let tmp = S[i]; S[i] = S[j]; S[j] = tmp;
            }

            // 4. 跳过 Meta Data (歌词/专辑信息)
            const metaLen = view.getUint32(offset, true);
            offset += 4;
            if (metaLen > 0) offset += metaLen;

            // 5. 跳过 CRC (5字节) & 封面图片 Chunk
            offset += 5;
            const imgLen = view.getUint32(offset, true);
            offset += 4 + imgLen;

            // 6. 流式还原音频原始数据 (真正精准的 RC4 变换算法)
            const cipherAudio = new Uint8Array(buffer, offset);
            const audioLen = cipherAudio.length;
            const audioData = new Uint8Array(audioLen);

            for (let i = 0; i < audioLen; i++) {
                const iSec = (i + 1) & 0xff;
                const streamKey = S[(S[iSec] + S[(S[iSec] + iSec) & 0xff]) & 0xff];
                audioData[i] = cipherAudio[i] ^ streamKey;
            }

            // 7. 严格检测头部魔数识别音频真实格式
            let ext = "mp3";
            let mimeType = "audio/mpeg";

            // FLAC 文件头: 'fLaC' (0x66 0x4C 0x61 0x43)
            if (audioData.length > 4 && 
                audioData[0] === 0x66 && audioData[1] === 0x4C && 
                audioData[2] === 0x61 && audioData[3] === 0x43) {
                ext = "flac";
                mimeType = "audio/flac";
            }

            const blob = new Blob([audioData], { type: mimeType });
            const cleanName = file.name.replace(/\.ncm$/i, '');

            return {
                blob: blob,
                filename: `${cleanName}.${ext}`,
                ext: ext
            };
        }
    </script>
</body>
</html>
