<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔓 NCM 格式在线解密器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/aes-js@3.1.2/index.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🔓 NCM 格式在线解密器</h1>
            <p class="text-sm text-slate-500 mt-1">本地直接将 NCM 还原为 MP3 / FLAC · 秒级解密</p>
        </div>

        <div id="dropzone" class="border-2 border-dashed border-indigo-200 rounded-xl p-8 text-center hover:border-indigo-500 transition cursor-pointer bg-indigo-50/30">
            <input type="file" id="fileInput" accept=".ncm" multiple class="hidden">
            <div class="space-y-2">
                <div class="text-4xl">🎼</div>
                <p class="text-sm font-medium text-slate-700">点击选择 NCM 文件 或 将文件拖拽到此处</p>
                <p class="text-xs text-slate-400">支持批量选择多个文件操作</p>
            </div>
        </div>

        <div id="fileList" class="mt-6 space-y-3 max-h-60 overflow-y-auto hidden"></div>
    </div>

    <script>
        const CORE_KEY = new Uint8Array([0x68,0x78,0x64,0x52,0x6d,0x30,0x6f,0x17,0x63,0x78,0x34,0x31,0x6c,0x70,0x65,0x5b]);

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('border-indigo-500', 'bg-indigo-100/50');
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-100/50');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-100/50');
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            fileList.classList.remove('hidden');
            for (let file of files) {
                if (!file.name.toLowerCase().endsWith('.ncm')) continue;
                
                const itemEl = document.createElement('div');
                itemEl.className = 'p-3 bg-slate-50 rounded-lg flex items-center justify-between border border-slate-200 text-xs';
                itemEl.innerHTML = `
                    <span class="font-medium text-slate-700 truncate max-w-[220px]">${file.name}</span>
                    <span class="status text-amber-600 font-bold">正在解密...</span>
                `;
                fileList.appendChild(itemEl);

                try {
                    const result = await processNcmFile(file);
                    const statusEl = itemEl.querySelector('.status');
                    
                    const url = URL.createObjectURL(result.blob);
                    statusEl.outerHTML = `
                        <a href="${url}" download="${result.filename}" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold transition">
                            📥 下载 ${result.ext.toUpperCase()}
                        </a>
                    `;
                } catch (err) {
                    const statusEl = itemEl.querySelector('.status');
                    statusEl.className = 'text-red-500 font-bold';
                    statusEl.innerText = '解密失败: ' + err.message;
                    console.error(err);
                }
            }
        }

        async function processNcmFile(file) {
            const buffer = await file.arrayBuffer();
            const view = new DataView(buffer);
            let offset = 0;

            // 1. 验证魔数 (CTEN)
            const header = view.getUint32(0, true);
            if (header !== 0x4e455443) throw new Error("非法的 NCM 文件格式");
            offset += 10;

            // 2. 解密密钥数据
            const keyLen = view.getUint32(offset, true);
            offset += 4;
            const keyData = new Uint8Array(buffer, offset, keyLen);
            offset += keyLen;

            for (let i = 0; i < keyData.length; i++) keyData[i] ^= 0x64;

            const aesEcb = new aesjs.ModeOfOperation.ecb(CORE_KEY);
            const decryptedKey = aesEcb.decrypt(keyData);
            const keyBytes = decryptedKey.slice(17);

            // 3. 构建 S 盒
            const S = new Uint8Array(256);
            for (let i = 0; i < 256; i++) S[i] = i;
            let j = 0;
            for (let i = 0; i < 256; i++) {
                j = (j + S[i] + keyBytes[i % keyBytes.length]) & 0xff;
                let tmp = S[i]; S[i] = S[j]; S[j] = tmp;
            }

            // 4. 跳过 Metadata 与 封面
            const metaLen = view.getUint32(offset, true);
            offset += 4;
            if (metaLen > 0) offset += metaLen;

            offset += 5; // CRC & gap
            const imgLen = view.getUint32(offset, true);
            offset += 4 + imgLen;

            // 5. 对剩余所有数据进行异或还原
            const audioRaw = new Uint8Array(buffer.slice(offset));
            const K = new Uint8Array(256);
            for (let i = 0; i < 256; i++) {
                K[i] = S[(S[i] + S[(i + S[i]) & 0xff]) & 0xff];
            }

            for (let i = 0; i < audioRaw.length; i++) {
                audioRaw[i] ^= K[i & 0xff];
            }

            // 6. 🔥【核心修复】智能寻找真正音频头部 Marker（兼容不同版本的网易云文件结构）
            let realAudioStart = 0;
            let ext = "mp3";
            let mimeType = "audio/mpeg";

            // 优先检测是否为 FLAC (fLaC 标识)
            for (let i = 0; i < Math.min(audioRaw.length - 4, 1024); i++) {
                if (audioRaw[i] === 0x66 && audioRaw[i+1] === 0x4c && audioRaw[i+2] === 0x61 && audioRaw[i+3] === 0x43) {
                    realAudioStart = i;
                    ext = "flac";
                    mimeType = "audio/flac";
                    break;
                }
            }

            // 如果不是 FLAC，寻找 MP3 ID3v2 头部 ("ID3") 或 Frame Sync (0xFF 0xFB / 0xFF 0xF3 / 0xFF 0xF2)
            if (ext === "mp3") {
                for (let i = 0; i < Math.min(audioRaw.length - 3, 1024); i++) {
                    // 匹配 ID3 标签
                    if (audioRaw[i] === 0x49 && audioRaw[i+1] === 0x44 && audioRaw[i+2] === 0x33) {
                        realAudioStart = i;
                        break;
                    }
                    // 匹配 MP3 帧头 Sync Word
                    if (audioRaw[i] === 0xff && (audioRaw[i+1] & 0xe0) === 0xe0) {
                        realAudioStart = i;
                        break;
                    }
                }
            }

            // 截取精准纯净的音频流
            const cleanAudio = audioRaw.subarray(realAudioStart);
            const blob = new Blob([cleanAudio], { type: mimeType });
            const originalName = file.name.replace(/\.ncm$/i, '');
            
            return {
                blob: blob,
                filename: `${originalName}.${ext}`,
                ext: ext
            };
        }
    </script>
</body>
</html>
