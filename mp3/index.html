<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 在线音频格式转换器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入纯 JS 的 MP3 编码库 lamejs，不依赖 SharedArrayBuffer，兼容性极佳 -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl p-6 sm:p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">🎵 在线音频转 MP3 转换器</h1>
            <p class="text-sm text-slate-500 mt-1">纯本地解码编码 · 兼容所有网络环境与浏览器</p>
        </div>

        <!-- 1. 文件选择 -->
        <div id="dropzone" class="border-2 border-dashed border-indigo-200 rounded-xl p-6 text-center hover:border-indigo-500 transition cursor-pointer bg-indigo-50/30">
            <input type="file" id="fileInput" accept="audio/*" class="hidden">
            <div class="space-y-2">
                <div class="text-4xl">🎼</div>
                <p class="text-sm font-medium text-slate-700">点击选择音频文件 或 将文件拖拽到此处</p>
                <p class="text-xs text-slate-400">支持 OGG, WAV, AAC, FLAC, M4A 等音频文件</p>
            </div>
        </div>

        <!-- 文件信息 -->
        <div id="fileInfo" class="hidden mt-4 p-4 bg-slate-50 rounded-lg flex items-center justify-between border border-slate-200">
            <div class="overflow-hidden mr-3">
                <div id="fileName" class="font-medium text-sm text-slate-800 truncate">audio.wav</div>
                <div id="fileSize" class="text-xs text-slate-400">0 MB</div>
            </div>
            <button id="removeFileBtn" class="text-xs text-red-500 hover:text-red-700 font-medium">移除</button>
        </div>

        <!-- 2. 设置与转换按钮 -->
        <div id="settingsArea" class="hidden mt-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">MP3 比特率设置</label>
                <select id="targetBitrate" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="192" selected>192 kbps (标准音质)</option>
                    <option value="128">128 kbps (较小体积)</option>
                    <option value="96">96 kbps (极小体积)</option>
                </select>
            </div>

            <button id="convertBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-indigo-200 transition">
                ⚡ 开始转换为 MP3
            </button>
        </div>

        <!-- 3. 进度条 -->
        <div id="progressArea" class="hidden mt-6 space-y-2">
            <div class="flex justify-between text-xs text-slate-600">
                <span id="statusText">正在解析音频流...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-150" style="width: 0%"></div>
            </div>
        </div>

        <!-- 4. 下载区域 -->
        <div id="resultArea" class="hidden mt-6 p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-center space-y-3">
            <div class="text-emerald-700 font-bold text-sm">🎉 MP3 转换完成！</div>
            <audio id="audioPreview" controls class="w-full h-10"></audio>
            <a id="downloadBtn" download class="inline-block w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-sm transition">
                📥 下载 MP3 文件
            </a>
        </div>
    </div>

    <script>
        let selectedFile = null;

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const settingsArea = document.getElementById('settingsArea');
        const convertBtn = document.getElementById('convertBtn');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        const audioPreview = document.getElementById('audioPreview');
        const downloadBtn = document.getElementById('downloadBtn');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('border-indigo-500', 'bg-indigo-100/50');
        });
        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-100/50');
        });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-indigo-500', 'bg-indigo-100/50');
            if (e.dataTransfer.files.length > 0) handleFileSelect(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
        });

        function handleFileSelect(file) {
            selectedFile = file;
            fileName.innerText = file.name;
            fileSize.innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
            fileInfo.classList.remove('hidden');
            settingsArea.classList.remove('hidden');
            resultArea.classList.add('hidden');
            progressArea.classList.add('hidden');
        }

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.add('hidden');
            settingsArea.classList.add('hidden');
            resultArea.classList.add('hidden');
            progressArea.classList.add('hidden');
        });

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-50', 'cursor-not-allowed');
            progressArea.classList.remove('hidden');
            resultArea.classList.add('hidden');

            try {
                statusText.innerText = '正在读取文件数据...';
                progressBar.style.width = '10%';
                progressPercent.innerText = '10%';

                const arrayBuffer = await selectedFile.arrayBuffer();
                
                statusText.innerText = '正在解码音频...';
                progressBar.style.width = '30%';
                progressPercent.innerText = '30%';

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                statusText.innerText = '正在编码为 MP3...';
                const bitrate = parseInt(document.getElementById('targetBitrate').value, 10);
                
                const mp3Blob = await encodeMp3Async(audioBuffer, bitrate, (percent) => {
                    const currentPercent = 30 + Math.round(percent * 0.65);
                    progressBar.style.width = currentPercent + '%';
                    progressPercent.innerText = currentPercent + '%';
                });

                progressBar.style.width = '100%';
                progressPercent.innerText = '100%';

                const url = URL.createObjectURL(mp3Blob);
                const originalBaseName = selectedFile.name.substring(0, selectedFile.name.lastIndexOf('.')) || selectedFile.name;
                const finalFileName = `${originalBaseName}_converted.mp3`;

                audioPreview.src = url;
                downloadBtn.href = url;
                downloadBtn.download = finalFileName;

                progressArea.classList.add('hidden');
                resultArea.classList.remove('hidden');

            } catch (err) {
                alert('转换失败：浏览器无法解码此音频格式或文件损坏。');
                console.error(err);
            } finally {
                convertBtn.disabled = false;
                convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });

        // 异步分块编码 MP3，避免界面卡顿
        function encodeMp3Async(audioBuffer, kbps, onProgress) {
            return new Promise((resolve) => {
                const channels = audioBuffer.numberOfChannels;
                const sampleRate = audioBuffer.sampleRate;
                const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);

                const samplesL = audioBuffer.getChannelData(0);
                const samplesR = channels > 1 ? audioBuffer.getChannelData(1) : samplesL;

                // 转换 32 位浮点数采样到 16 位整数 PCM
                const leftInt16 = new Int16Array(samplesL.length);
                const rightInt16 = new Int16Array(samplesR.length);

                for (let i = 0; i < samplesL.length; i++) {
                    let sL = Math.max(-1, Math.min(1, samplesL[i]));
                    leftInt16[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;

                    let sR = Math.max(-1, Math.min(1, samplesR[i]));
                    rightInt16[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
                }

                const sampleBlockSize = 1152;
                const mp3Data = [];
                let length = leftInt16.length;
                let offset = 0;

                function processChunk() {
                    let end = Math.min(offset + sampleBlockSize * 100, length);
                    
                    for (let i = offset; i < end; i += sampleBlockSize) {
                        const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
                        const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
                        
                        let mp3buf;
                        if (channels === 1) {
                            mp3buf = mp3encoder.encodeBuffer(leftChunk);
                        } else {
                            mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                        }

                        if (mp3buf.length > 0) {
                            mp3Data.push(mp3buf);
                        }
                    }

                    offset = end;
                    onProgress(offset / length * 100);

                    if (offset < length) {
                        setTimeout(processChunk, 0);
                    } else {
                        const mp3buf = mp3encoder.flush();
                        if (mp3buf.length > 0) {
                            mp3Data.push(mp3buf);
                        }
                        resolve(new Blob(mp3Data, { type: 'audio/mp3' }));
                    }
                }

                processChunk();
            });
        }
    </script>
</body>
</html>
